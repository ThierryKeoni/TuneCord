name: Build & Release

# Push a tag like v1.0.0  ->  builds Windows, macOS and Linux and attaches
# the installers to a GitHub Release. Run it by hand (Actions tab) to just build.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: TuneCord-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Description = release-notes/<tag>.md (if it exists) + download instructions
      - name: Write release description
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          {
            if [ -f "release-notes/$TAG.md" ]; then cat "release-notes/$TAG.md"; else echo "## TuneCord $TAG"; fi
            echo
            echo "### Which file do I download?"
            echo "- **Windows:** \`TuneCord-Setup-*.exe\` (installer) or \`TuneCord-Portable-*.exe\` (no install). On \"Windows protected your PC\" click **More info → Run anyway**."
            echo "- **macOS:** the \`.dmg\`. First time: right-click → Open."
            echo "- **Linux / Steam Deck:** the \`.AppImage\` (make it executable)."
            echo
            echo "Don't use \"Source code (zip)\": that's the code, not the app. Keep the Discord desktop app open while TuneCord runs."
          } > release-body.md
          cat release-body.md
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          body_path: release-body.md
          generate_release_notes: true
